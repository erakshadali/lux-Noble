<style>
  :root { --bg:#0b0b10; --card:#15151d; --ink:#f4f2ee; --muted:#9d9aa8; --line:#2a2a37; --wa:#25d366; --wa-ink:#062b14; --warn:#ffb020; --bad:#ff5a6e; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  header { position:sticky; top:0; z-index:5; background:rgba(11,11,16,.94); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); padding:14px 16px 12px; }
  .wrap { max-width:760px; margin:0 auto; }
  h1 { margin:0; font-size:20px; }
  .sub { margin:4px 0 10px; color:var(--muted); font-size:13px; }
  .stats { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  .tab { border:1px solid var(--line); background:var(--card); color:var(--ink); padding:7px 12px; border-radius:999px; font-size:13px; font-weight:700; cursor:pointer; }
  .tab[aria-pressed="true"] { background:var(--ink); color:var(--bg); border-color:var(--ink); }
  input[type=search] { width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink); font-size:15px; }
  main { padding:8px 16px 60px; }
  .lead { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin:10px 0; }
  .top { display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
  .name { font-weight:800; font-size:16px; }
  .meta { color:var(--muted); font-size:13px; margin-top:2px; }
  .meta a { color:var(--muted); }
  .badge { flex:none; font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; padding:4px 8px; border-radius:999px; border:1px solid var(--line); color:var(--muted); }
  .badge.sent { color:var(--wa); border-color:var(--wa); }
  .badge.none { color:var(--bad); border-color:var(--bad); }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .btn { border:0; border-radius:10px; padding:11px 14px; font-weight:800; font-size:14px; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; gap:6px; }
  .wa { background:var(--wa); color:var(--wa-ink); }
  .ghost { background:transparent; color:var(--ink); border:1px solid var(--line); }
  .ghost.on { background:var(--ink); color:var(--bg); }
  .warn { margin-top:10px; font-size:13px; color:var(--warn); }
  .empty { color:var(--muted); text-align:center; padding:40px 0; }
</style>
</head>

const KEY = "onwebsite-leads-marks-v1";
let marks = {};
try { marks = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(marks)); } catch (e) {} };

// Always open the WhatsApp Business account: Android app directly, WhatsApp Web on a computer.
const ua = navigator.userAgent;
const device = /Android/i.test(ua) ? "android" : /iPhone|iPad|iPod/i.test(ua) ? "ios" : "computer";
function link(l) {
  const t = encodeURIComponent(l.text);
  if (device === "android") return "intent://send?phone=" + l.phone + "&text=" + t + "#Intent;scheme=whatsapp;package=com.whatsapp.w4b;end";
  if (device === "ios") return "https://wa.me/" + l.phone + "?text=" + t;
  return "https://web.whatsapp.com/send?phone=" + l.phone + "&text=" + t;
}
const statusOf = (l) => marks[l.n] || l.status;

const FILTERS = [["pending", "To send"], ["sent", "Sent"], ["not_on_whatsapp", "No WhatsApp"], ["all", "All"]];
let filter = "pending";

function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]); }

function render() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const counts = { pending: 0, sent: 0, not_on_whatsapp: 0, all: LEADS.length };
  LEADS.forEach((l) => counts[statusOf(l)]++);
  document.getElementById("tabs").innerHTML = FILTERS.map(([k, label]) =>
    '<button class="tab" data-f="' + k + '" aria-pressed="' + (filter === k) + '">' + label + " " + counts[k] + "</button>").join("");

  const shown = LEADS.filter((l) => (filter === "all" || statusOf(l) === filter) &&
    (!q || l.name.toLowerCase().includes(q) || l.phone.includes(q.replace(/\D/g, "") || "~")));
  document.getElementById("list").innerHTML = shown.length ? shown.map((l) => {
    const st = statusOf(l);
    const badge = st === "sent" ? '<span class="badge sent">Sent</span>' : st === "not_on_whatsapp" ? '<span class="badge none">No WhatsApp</span>' : '<span class="badge">To send</span>';
    const warn = l.status === "sent" ? '<div class="warn">Already sent. Do not send again.</div>' : l.status === "not_on_whatsapp" ? '<div class="warn">WhatsApp said this number is not on WhatsApp. Try a call instead.</div>' : "";
    return '<article class="lead"><div class="top"><div><div class="name">' + esc(l.name) + '</div><div class="meta"><a href="tel:+' + l.phone + '">' + esc(l.display) + '</a> · <a href="' + esc(l.url) + '" target="_blank" rel="noopener">Demo website</a></div></div>' + badge + "</div>" + warn +
      '<div class="row">' +
      (l.status === "pending" ? '<a class="btn wa" target="onwebsite-wa" rel="noopener" href="' + esc(link(l)) + '">Send on WhatsApp</a>' : "") +
      '<button class="btn ghost' + (marks[l.n] === "sent" ? " on" : "") + '" data-m="sent" data-n="' + l.n + '">Sent</button>' +
      '<button class="btn ghost' + (marks[l.n] === "not_on_whatsapp" ? " on" : "") + '" data-m="not_on_whatsapp" data-n="' + l.n + '">No WhatsApp</button>' +
      '<button class="btn ghost" data-copy="' + l.n + '">Copy message</button>' +
      "</div></article>";
  }).join("") : '<p class="empty">Nothing here.</p>';
}

document.addEventListener("click", async (e) => {
  const t = e.target.closest("button");
  if (!t) return;
  if (t.dataset.f) { filter = t.dataset.f; render(); }
  if (t.dataset.m) { const n = t.dataset.n; marks[n] = marks[n] === t.dataset.m ? undefined : t.dataset.m; if (!marks[n]) delete marks[n]; save(); render(); }
  if (t.dataset.copy) {
    const l = LEADS.find((x) => String(x.n) === t.dataset.copy);
    try { await navigator.clipboard.writeText(l.text); t.textContent = "Copied"; setTimeout(() => (t.textContent = "Copy message"), 1200); } catch (err) {}
  }
});
document.getElementById("q").addEventListener("input", render);
render();
</script>
