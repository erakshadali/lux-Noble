<style>
  :root { --bg:#0b0b10; --card:#15151d; --ink:#f4f2ee; --muted:#9d9aa8; --line:#2a2a37; --ig1:#f58529; --ig2:#dd2a7b; --ig3:#8134af; --ok:#25d366; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  header { position:sticky; top:0; z-index:5; background:rgba(11,11,16,.94); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); padding:14px 16px 12px; }
  .wrap { max-width:760px; margin:0 auto; }
  h1 { margin:0; font-size:20px; }
  .sub { margin:4px 0 10px; color:var(--muted); font-size:13px; }
  .stats { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  .tab { border:1px solid var(--line); background:var(--card); color:var(--ink); padding:7px 12px; border-radius:999px; font-size:13px; font-weight:700; cursor:pointer; }
  .tab[aria-pressed="true"] { background:var(--ink); color:var(--bg); border-color:var(--ink); }
  input[type=search] { width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink); font-size:15px; }
  main { padding:8px 16px 60px; }
  .lead { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin:10px 0; }
  .top { display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
  .name { font-weight:800; font-size:16px; }
  .meta { color:var(--muted); font-size:13px; margin-top:2px; }
  .meta a { color:var(--muted); }
  .badge { flex:none; font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; padding:4px 8px; border-radius:999px; border:1px solid var(--line); color:var(--muted); }
  .badge.sent { color:var(--ok); border-color:var(--ok); }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .btn { border:0; border-radius:10px; padding:11px 14px; font-weight:800; font-size:14px; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; gap:6px; color:var(--ink); }
  .ig { background:linear-gradient(45deg, var(--ig1), var(--ig2), var(--ig3)); color:#fff; }
  .ghost { background:transparent; border:1px solid var(--line); }
  .ghost.on { background:var(--ink); color:var(--bg); }
  .toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:999px; font-weight:800; font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.show { opacity:1; }
  .empty { color:var(--muted); text-align:center; padding:40px 0; }
</style>
</head>

const KEY = "onwebsite-insta-marks-v1";
let marks = {};
try { marks = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(marks)); } catch (e) {} };
let filter = "todo";

function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]); }

function render() {
  const q = document.getElementById("q").value.trim().toLowerCase().replace(/^@/, "");
  const sent = LEADS.filter((l) => marks[l.n]).length;
  const counts = { todo: LEADS.length - sent, sent, all: LEADS.length };
  document.getElementById("tabs").innerHTML = [["todo", "To send"], ["sent", "Sent"], ["all", "All"]].map(([k, label]) =>
    '<button class="tab" data-f="' + k + '" aria-pressed="' + (filter === k) + '">' + label + " " + counts[k] + "</button>").join("");
  const shown = LEADS.filter((l) => (filter === "all" || (filter === "sent") === !!marks[l.n]) &&
    (!q || l.name.toLowerCase().includes(q) || l.handle.toLowerCase().includes(q)));
  document.getElementById("list").innerHTML = shown.length ? shown.map((l) =>
    '<article class="lead"><div class="top"><div><div class="name">' + esc(l.name) + '</div><div class="meta">@' + esc(l.handle) + (l.area ? " · " + esc(l.area) : "") +
    ' · <a href="' + esc(l.url) + '" target="_blank" rel="noopener">Demo website</a></div></div>' +
    (marks[l.n] ? '<span class="badge sent">Sent</span>' : '<span class="badge">To send</span>') + "</div>" +
    '<div class="row"><button class="btn ig" data-open="' + l.n + '">Copy + open DM</button>' +
    '<button class="btn ghost' + (marks[l.n] ? " on" : "") + '" data-m="' + l.n + '">Sent</button>' +
    '<button class="btn ghost" data-copy="' + l.n + '">Copy message</button></div></article>'
  ).join("") : '<p class="empty">Nothing here.</p>';
}

async function copy(text) {
  try { await navigator.clipboard.writeText(text); } catch (e) {}
  const t = document.getElementById("toast");
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1800);
}

document.addEventListener("click", async (e) => {
  const t = e.target.closest("button");
  if (!t) return;
  if (t.dataset.f) { filter = t.dataset.f; render(); }
  if (t.dataset.m) { const n = t.dataset.m; if (marks[n]) delete marks[n]; else marks[n] = 1; save(); render(); }
  const n = t.dataset.open || t.dataset.copy;
  if (n) {
    const l = LEADS.find((x) => String(x.n) === n);
    await copy(l.text);
    // ig.me opens the DM screen in the Instagram app (or instagram.com on a computer).
    if (t.dataset.open) window.open("https://ig.me/m/" + l.handle, "_blank", "noopener");
  }
});
document.getElementById("q").addEventListener("input", render);
render();
</script>
